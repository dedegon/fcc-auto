[project]
name = "claude-auto"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9"]

[project.scripts]
claude-auto = "claude_auto:main"
claude-auto-test = "claude_auto:test_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["claude_auto", "claude_filter", "scanner", "scanner_config"]
packages = ["model_limits"]